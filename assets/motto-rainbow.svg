<svg xmlns="http://www.w3.org/2000/svg" width="262" height="28" viewBox="0 0 262 28" role="img" aria-label="纵然岁月尘埃,总有繁花为你盛开">
<title>纵然岁月尘埃,总有繁花为你盛开</title>

<defs>
  <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="11.00" y1="0" x2="251.00" y2="0">
    <stop offset="0.000" stop-color="#d73a49"/>
    <stop offset="0.167" stop-color="#c65d21"/>
    <stop offset="0.333" stop-color="#997600"/>
    <stop offset="0.500" stop-color="#168443"/>
    <stop offset="0.667" stop-color="#087f9c"/>
    <stop offset="0.833" stop-color="#2563eb"/>
    <stop offset="1.000" stop-color="#9c36b5"/>
  </linearGradient>
</defs>

<style>
text{
  fill:url(#rainbow);
  font-family:monospace,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:16px
}

@keyframes typing {
  0%, 5% {
    opacity: 0;
  }
  5.1%, 85% {
    opacity: 1;
  }
  95%, 100% {
    opacity: 0;
  }
}

tspan{
  opacity:0;
  animation:typing 6s linear infinite;
}

.c0{animation-delay:0.0s}
.c1{animation-delay:0.1s}
.c2{animation-delay:0.2s}
.c3{animation-delay:0.3s}
.c4{animation-delay:0.4s}
.c5{animation-delay:0.5s}
.c6{animation-delay:0.6s}
.c7{animation-delay:0.7s}
.c8{animation-delay:0.8s}
.c9{animation-delay:0.9s}
.c10{animation-delay:1.0s}
.c11{animation-delay:1.1s}
.c12{animation-delay:1.2s}
.c13{animation-delay:1.3s}
.c14{animation-delay:1.4s}

@media(prefers-reduced-motion:reduce){
  tspan{animation:none;opacity:1}
}
</style>

<text y="20" xml:space="preserve">
  <tspan x="11.00" class="c0">纵</tspan>
  <tspan x="27.00" class="c1">然</tspan>
  <tspan x="43.00" class="c2">岁</tspan>
  <tspan x="59.00" class="c3">月</tspan>
  <tspan x="75.00" class="c4">尘</tspan>
  <tspan x="91.00" class="c5">埃</tspan>
  <tspan x="107.00" class="c6">,</tspan>
  <tspan x="123.00" class="c7">总</tspan>
  <tspan x="139.00" class="c8">有</tspan>
  <tspan x="155.00" class="c9">繁</tspan>
  <tspan x="171.00" class="c10">花</tspan>
  <tspan x="187.00" class="c11">为</tspan>
  <tspan x="203.00" class="c12">你</tspan>
  <tspan x="219.00" class="c13">盛</tspan>
  <tspan x="235.00" class="c14">开</tspan>
</text>
</svg>
